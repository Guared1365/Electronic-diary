<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#764ba2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<!-- CSP: запрещаем внешние скрипты, разрешаем inline для наших onclick-обработчиков -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Электронный дневник</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; color: #333;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 1150px; margin: 0 auto; }
  h1 { color: white; text-align: center; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .today-banner {
    background: rgba(255,255,255,.2); color: white; text-align: center;
    padding: 10px 20px; border-radius: 12px; margin-bottom: 20px;
    font-weight: 600; backdrop-filter: blur(10px);
    display: flex; justify-content: center; gap: 25px; flex-wrap: wrap;
  }
  .today-banner b { color: #fff3c4; }
  .today-banner span { white-space: nowrap; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    flex: 1; min-width: 100px; padding: 12px;
    background: rgba(255,255,255,.3); color: white;
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 15px; font-weight: 600; transition: .2s;
  }
  .tab:hover { background: rgba(255,255,255,.45); }
  .tab.active { background: white; color: #764ba2; }
  .panel {
    background: white; border-radius: 15px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); display: none;
  }
  .panel.active { display: block; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .row-2 { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input, select, textarea {
    padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;
    font-size: 14px; font-family: inherit; flex: 1; min-width: 100px;
    outline: none; transition: .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: #764ba2; }
  input[type="time"] { max-width: 130px; }
  button.btn {
    padding: 10px 20px; background: #764ba2; color: white;
    border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: .2s;
  }
  button.btn:hover { background: #5a3a7d; }
  button.del { background: #ff4757; padding: 6px 12px; font-size: 12px; }
  button.del:hover { background: #d63031; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th {
    background: #f4f0fa; padding: 10px; text-align: left;
    font-size: 13px; color: #764ba2; border-bottom: 2px solid #764ba2;
  }
  td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  tr:hover td { background: #faf8ff; }
  .badge {
    display: inline-block; padding: 3px 10px;
    border-radius: 20px; font-size: 12px; font-weight: 700;
  }
  .g5 { background: #d4f8d4; color: #1a7f1a; }
  .g4 { background: #d4e8f8; color: #1a5f9f; }
  .g3 { background: #fff3c4; color: #b8860b; }
  .g2 { background: #ffd4d4; color: #c0392b; }
  .empty { text-align: center; color: #999; padding: 30px; font-style: italic; }
  .hw-item {
    background: #faf8ff; border-left: 4px solid #764ba2;
    padding: 12px 15px; margin-bottom: 10px; border-radius: 8px;
    display: flex; justify-content: space-between;
    align-items: start; gap: 12px; transition: .2s;
  }
  .hw-item.done { background: #f2f9f2; border-left-color: #4caf50; opacity: .75; }
  .hw-item.done .subject,
  .hw-item.done .task { text-decoration: line-through; color: #888; }
  .hw-item.overdue { border-left-color: #ff4757; background: #fff5f5; }
  .hw-item .info { flex: 1; }
  .hw-item .subject { font-weight: 700; color: #764ba2; margin-bottom: 4px; }
  .hw-item .task { font-size: 14px; color: #444; }
  .hw-item .date { font-size: 12px; color: #999; margin-top: 4px; }
  .hw-item .date.overdue-text { color: #ff4757; font-weight: 700; }
  .hw-actions { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .checkbox {
    width: 26px; height: 26px; border: 2px solid #764ba2; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: .2s; background: white;
  }
  .checkbox:hover { background: #f4f0fa; }
  .checkbox.checked { background: #4caf50; border-color: #4caf50; color: white; font-size: 16px; font-weight: bold; }
  .week-switcher {
    display: flex; gap: 8px; margin: 15px 0;
    background: #f4f0fa; padding: 6px; border-radius: 12px;
    flex-wrap: wrap;
  }
  .week-btn {
    flex: 1; min-width: 90px; padding: 10px 12px; border: none; border-radius: 8px;
    background: transparent; color: #764ba2;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: .2s;
  }
  .week-btn:hover { background: rgba(118,75,162,.1); }
  .week-btn.active { background: #764ba2; color: white; box-shadow: 0 3px 10px rgba(118,75,162,.4); }
  .day-block { margin-bottom: 20px; }
  .day-title {
    background: #764ba2; color: white; padding: 10px 15px;
    border-radius: 8px 8px 0 0; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
  }
  .day-title.today { background: #e67e22; }
  .day-title .duration {
    font-size: 12px; font-weight: 500;
    background: rgba(255,255,255,.25);
    padding: 3px 10px; border-radius: 20px;
  }
  .day-title .today-tag {
    background: white; color: #e67e22;
    padding: 2px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 800; margin-left: 8px;
  }
  .day-content {
    border: 1px solid #e0e0e0; border-top: none;
    border-radius: 0 0 8px 8px; padding: 10px;
  }
  .lesson-row {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 12px;
    border-bottom: 1px dashed #eee; font-size: 14px;
    gap: 10px; transition: .2s;
    border-left: 5px solid transparent;
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-row.type-lecture { border-left-color: #4caf50; }
  .lesson-row.type-seminar { border-left-color: #ff9800; }
  .lesson-row.cancelled { background: #fff5f5; opacity: .7; }
  .lesson-row.cancelled .lesson-info .subject-name { text-decoration: line-through; color: #999; }
  .lesson-row.attended { background: #f2f9f2; }
  .lesson-row.missed { background: #fff5f0; }
  .lesson-row.now {
    background: linear-gradient(90deg, #fff8e0 0%, #fffbe8 100%);
    box-shadow: inset 0 0 0 2px #ffc107;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: inset 0 0 0 2px #ffc107; }
    50% { box-shadow: inset 0 0 0 3px #ff9800; }
  }
  .lesson-row .lesson-info {
    flex: 1; display: flex; align-items: center;
    gap: 8px; flex-wrap: wrap;
  }
  .lesson-row .subject-name { font-weight: 700; color: #333; }
  .lesson-row .time-badge {
    background: #f4f0fa; color: #764ba2;
    padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .lesson-row .date-badge {
    background: #fff3c4; color: #b8860b;
    padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .lesson-row .period-badge {
    background: #e8f8e8; color: #1a7f1a;
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .lesson-row .duration-badge {
    background: #e8f4ff; color: #1a5f9f;
    padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .lesson-row .status-badge {
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .status-badge.cancelled { background: #ffe0e0; color: #c0392b; }
  .status-badge.attended { background: #d4f8d4; color: #1a7f1a; }
  .status-badge.missed { background: #ffe6cc; color: #b35c00; }
  .status-badge.now { background: #ffc107; color: #5a3a00; animation: pulse-badge 1.5s infinite; }
  @keyframes pulse-badge { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  .type-badge {
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .type-badge.lecture { background: #d4f8d4; color: #1a7f1a; }
  .type-badge.seminar { background: #ffe6cc; color: #b35c00; }
  .lesson-meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 12px; color: #666; margin-top: 4px; width: 100%;
  }
  .lesson-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .week-badge {
    padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .week-badge.numerator { background: #e0f0ff; color: #1a5f9f; }
  .week-badge.denominator { background: #ffe8f5; color: #a0166c; }
  .week-badge.both { background: #f0e8ff; color: #5a3a7d; }
  .lesson-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .icon-btn {
    width: 32px; height: 32px; border: 2px solid transparent;
    border-radius: 8px; cursor: pointer;
    font-size: 14px; background: #f4f0fa;
    transition: .2s; display: flex;
    align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: #e0d4f0; }
  .icon-btn.attend.active { background: #4caf50; color: white; border-color: #4caf50; }
  .icon-btn.miss.active { background: #ff9800; color: white; border-color: #ff9800; }
  .icon-btn.cancel.active { background: #ff4757; color: white; border-color: #ff4757; }
  .icon-btn.del-btn { background: transparent; color: #ff4757; font-size: 16px; font-weight: bold; }
  .icon-btn.del-btn:hover { background: #ffe0e0; }
  .hw-counter {
    display: inline-block; background: #ff4757; color: white;
    font-size: 12px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
    margin-left: 6px; vertical-align: middle;
  }
  .legend {
    display: flex; gap: 15px; flex-wrap: wrap;
    margin-top: 15px; padding: 12px;
    background: #faf8ff; border-radius: 10px;
    font-size: 12px; color: #666;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
  .legend-bar { width: 6px; height: 16px; border-radius: 3px; }
  .now-block {
    background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
    color: #5a3a00; padding: 15px 20px;
    border-radius: 12px; margin-bottom: 15px;
    display: flex; align-items: center; gap: 15px;
    box-shadow: 0 5px 15px rgba(255,152,0,.3);
  }
  .now-block.now-now {
    background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%);
    color: white;
  }
  .now-block .icon { font-size: 32px; }
  .now-block .info { flex: 1; }
  .now-block .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: .8; font-weight: 700; }
  .now-block .subject { font-size: 18px; font-weight: 800; margin: 2px 0; }
  .now-block .details { font-size: 13px; opacity: .9; }
  .calendar-controls {
    display: flex; gap: 8px; margin-bottom: 15px;
    align-items: center; flex-wrap: wrap;
  }
  .calendar-title {
    font-size: 20px; font-weight: 800; color: #764ba2;
    text-transform: capitalize; margin: 0 10px;
  }
  .cal-nav-btn {
    padding: 8px 16px; background: #f4f0fa; color: #764ba2;
    border: none; border-radius: 8px; cursor: pointer;
    font-size: 16px; font-weight: 700; transition: .2s;
  }
  .cal-nav-btn:hover { background: #e0d4f0; }
  .calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 20px;
  }
  .cal-weekday {
    text-align: center; padding: 8px;
    font-weight: 700; font-size: 12px;
    color: #764ba2; text-transform: uppercase;
  }
  .cal-day {
    min-height: 85px; padding: 6px;
    background: #faf8ff; border-radius: 8px;
    cursor: pointer; transition: .2s;
    position: relative;
    display: flex; flex-direction: column;
    border: 2px solid transparent;
  }
  .cal-day:hover { background: #f0e8ff; transform: translateY(-1px); }
  .cal-day.other-month { opacity: .35; }
  .cal-day.today {
    background: #fff8e0; border-color: #ff9800;
    box-shadow: 0 3px 10px rgba(255,152,0,.3);
  }
  .cal-day.today .cal-date { background: #ff9800; color: white; }
  .cal-day.selected {
    border-color: #764ba2; background: #f0e8ff;
    box-shadow: 0 3px 10px rgba(118,75,162,.3);
  }
  .cal-date {
    font-weight: 800; font-size: 13px;
    color: #764ba2; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .cal-lessons {
    margin-top: 4px; display: flex; flex-direction: column;
    gap: 2px; flex: 1; overflow: hidden;
  }
  .cal-lesson-dot {
    font-size: 10px; padding: 2px 5px;
    border-radius: 4px; font-weight: 600;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: white;
  }
  .cal-lesson-dot.lecture { background: #4caf50; }
  .cal-lesson-dot.seminar { background: #ff9800; }
  .cal-lesson-dot.cancelled { background: #bbb; text-decoration: line-through; }
  .cal-more { font-size: 10px; color: #999; font-weight: 600; padding: 1px 5px; }
  .cal-day-details {
    background: #faf8ff; padding: 15px;
    border-radius: 12px; margin-top: 10px;
  }
  .cal-day-details h3 {
    color: #764ba2; margin-bottom: 10px;
    font-size: 16px; text-transform: capitalize;
  }
  .cal-day-lesson {
    background: white; padding: 10px 12px;
    border-radius: 8px; margin-bottom: 8px;
    border-left: 4px solid #4caf50;
    display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  .cal-day-lesson.seminar { border-left-color: #ff9800; }
  .cal-day-lesson.cancelled { opacity: .6; border-left-color: #ccc; }
  .cal-day-lesson.cancelled .subject { text-decoration: line-through; }
  .cal-day-lesson .subject { font-weight: 700; }
  .cal-day-lesson .meta { font-size: 12px; color: #666; margin-top: 3px; }
  /* Баннер установки PWA */
  .install-banner {
    display: none; background: white; color: #764ba2;
    padding: 12px 20px; border-radius: 10px;
    margin-bottom: 15px; font-weight: 600;
    align-items: center; justify-content: space-between;
    gap: 10px; box-shadow: 0 5px 20px rgba(0,0,0,.2);
  }
  .install-banner.show { display: flex; }
  .install-banner button {
    background: #764ba2; color: white; border: none;
    padding: 8px 16px; border-radius: 8px;
    cursor: pointer; font-weight: 700;
  }
  .install-banner .close-btn {
    background: transparent; color: #999;
    padding: 4px 10px; font-size: 18px;
  }
  /* Онлайн/офлайн индикатор */
  .offline-badge {
    display: none; background: #ff4757; color: white;
    padding: 6px 12px; border-radius: 8px;
    text-align: center; font-size: 13px; font-weight: 700;
    margin-bottom: 15px;
  }
  .offline-badge.show { display: block; }
  @media (max-width: 600px) {
    .cal-day { min-height: 60px; padding: 4px; }
    .cal-lesson-dot { font-size: 9px; padding: 1px 3px; }
    .calendar-title { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📚 Электронный дневник</h1>

  <div id="installBanner" class="install-banner">
    <span>📲 Установить как приложение?</span>
    <div>
      <button onclick="installPWA()">Установить</button>
      <button class="close-btn" onclick="hideInstallBanner()">×</button>
    </div>
  </div>

  <div id="offlineBadge" class="offline-badge">📴 Нет соединения — работаем офлайн</div>

  <div class="today-banner">
    <span id="todayDate">📅 Сегодня</span>
    <span id="todayWeek">🗓 Неделя: —</span>
    <span id="todayTime">🕐 --:--:--</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('schedule', this)">🗓 Расписание</button>
    <button class="tab" onclick="switchTab('calendar', this)">📆 Календарь</button>
    <button class="tab" onclick="switchTab('grades', this)">⭐ Оценки</button>
    <button class="tab" onclick="switchTab('homework', this)">📝 Д/З<span id="hwCounter" class="hw-counter" style="display:none">0</span></button>
  </div>

  <!-- РАСПИСАНИЕ -->
  <div id="schedule" class="panel active">
    <div class="row">
      <select id="sDay" style="flex:1.2">
        <option>Понедельник</option><option>Вторник</option><option>Среда</option>
        <option>Четверг</option><option>Пятница</option><option>Суббота</option>
      </select>
      <select id="sWeek" style="flex:1.2">
        <option value="both">Каждую неделю</option>
        <option value="numerator">Числитель (I)</option>
        <option value="denominator">Знаменатель (II)</option>
      </select>
      <select id="sType" style="flex:1">
        <option value="lecture">🟢 Лекция</option>
        <option value="seminar">🟠 Семинар</option>
      </select>
      <input id="sNum" type="number" placeholder="№" min="1" style="max-width:70px">
    </div>
    <div class="row-2">
      <input id="sSubject" placeholder="Предмет" style="flex:2" maxlength="100">
      <input id="sRoom" placeholder="Кабинет" style="flex:1" maxlength="30">
      <input id="sTeacher" placeholder="Преподаватель" style="flex:1.5" maxlength="100">
    </div>
    <div class="row-2">
      <input id="sStart" type="time" title="Начало">
      <input id="sEnd" type="time" title="Конец">
    </div>
    <div class="row-2">
      <label style="flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:#666">
        Действует с: <input id="sDateFrom" type="date" style="flex:1">
      </label>
      <label style="flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:#666">
        по: <input id="sDateTo" type="date" style="flex:1">
      </label>
      <button class="btn" onclick="addLesson()" style="flex:1">+ Добавить</button>
    </div>
    <div style="font-size:11px;color:#999;margin-bottom:12px;padding-left:4px">
      💡 Пустые даты — урок действует весь семестр
    </div>

    <div id="nowBlock"></div>

    <div class="week-switcher">
      <button class="week-btn" data-view="current" onclick="setWeekView('current')">📍 Текущая</button>
      <button class="week-btn" data-view="numerator" onclick="setWeekView('numerator')">🔵 Числитель</button>
      <button class="week-btn" data-view="denominator" onclick="setWeekView('denominator')">🟣 Знаменатель</button>
      <button class="week-btn" data-view="both" onclick="setWeekView('both')">⚪ Обе</button>
    </div>

    <div id="scheduleView"></div>

    <div class="legend">
      <div class="legend-item"><span class="legend-bar" style="background:#4caf50"></span> Лекция</div>
      <div class="legend-item"><span class="legend-bar" style="background:#ff9800"></span> Семинар</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ffc107"></span> Идёт</div>
      <div class="legend-item"><span class="legend-dot" style="background:#4caf50"></span> Был</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff9800"></span> Пропуск</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ff4757"></span> Отменён</div>
    </div>
  </div>

  <!-- КАЛЕНДАРЬ -->
  <div id="calendar" class="panel">
    <div class="calendar-controls">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <div class="calendar-title" id="calTitle">—</div>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
      <button class="cal-nav-btn" onclick="calGoToday()" style="margin-left:auto;font-size:13px">📍 Сегодня</button>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
    <div id="calDayDetails"></div>
  </div>

  <!-- ОЦЕНКИ -->
  <div id="grades" class="panel">
    <div class="row">
      <input id="gSubject" placeholder="Предмет" maxlength="100">
      <input id="gValue" type="number" placeholder="Оценка" min="2" max="5" style="max-width:110px">
      <input id="gDate" type="date">
      <input id="gComment" placeholder="Комментарий" maxlength="200">
      <button class="btn" onclick="addGrade()">+ Добавить</button>
    </div>
    <table>
      <thead><tr><th>Предмет</th><th>Оценка</th><th>Дата</th><th>Комментарий</th><th></th></tr></thead>
      <tbody id="gradesBody"></tbody>
    </table>
    <div id="gradesStats" style="margin-top:15px;padding:15px;background:#f4f0fa;border-radius:10px;font-weight:600;color:#764ba2"></div>
  </div>

  <!-- Д/З -->
  <div id="homework" class="panel">
    <div class="row">
      <input id="hSubject" placeholder="Предмет" maxlength="100">
      <input id="hTask" placeholder="Задание" style="flex:2" maxlength="500">
      <input id="hDate" type="date">
      <button class="btn" onclick="addHW()">+ Добавить</button>
    </div>
    <div id="hwList" style="margin-top:15px"></div>
  </div>
</div>

<script>
// ============================================================
// 🔒 БЕЗОПАСНОСТЬ: экранирование пользовательского ввода
// Защита от XSS. Используется везде, где данные попадают в innerHTML.
// ============================================================
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ============================================================
// 🔒 Валидация данных при загрузке из localStorage
// Защита от повреждённых/подсунутых данных.
// ============================================================
function isValidDateStr(s) {
  if (!s) return true; // пусто — ок
  if (typeof s !== 'string') return false;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = new Date(s);
  return !isNaN(d.getTime());
}

function isValidTimeStr(s) {
  if (!s) return true;
  return typeof s === 'string' && /^\d{2}:\d{2}$/.test(s);
}

function sanitizeLesson(l) {
  if (!l || typeof l !== 'object') return null;
  const day = DAYS.includes(l.day) ? l.day : null;
  if (!day) return null;
  if (typeof l.subject !== 'string' || !l.subject) return null;
  return {
    id: typeof l.id === 'number' || typeof l.id === 'string' ? l.id : crypto.randomUUID(),
    day,
    week: ['both','numerator','denominator'].includes(l.week) ? l.week : 'both',
    type: ['lecture','seminar'].includes(l.type) ? l.type : 'lecture',
    num: typeof l.num === 'string' || typeof l.num === 'number' ? String(l.num) : '',
    subject: l.subject.slice(0, 100),
    room: typeof l.room === 'string' ? l.room.slice(0, 30) : '',
    teacher: typeof l.teacher === 'string' ? l.teacher.slice(0, 100) : '',
    start: isValidTimeStr(l.start) ? l.start : '',
    end: isValidTimeStr(l.end) ? l.end : '',
    dateFrom: isValidDateStr(l.dateFrom) ? l.dateFrom : null,
    dateTo: isValidDateStr(l.dateTo) ? l.dateTo : null,
    status: ['attended','missed','cancelled',null].includes(l.status) ? l.status : null
  };
}

function sanitizeGrade(g) {
  if (!g || typeof g !== 'object') return null;
  if (typeof g.subject !== 'string' || !g.subject) return null;
  const value = parseInt(g.value);
  if (!value || value < 2 || value > 5) return null;
  return {
    id: typeof g.id === 'number' || typeof g.id === 'string' ? g.id : crypto.randomUUID(),
    subject: g.subject.slice(0, 100),
    value,
    date: isValidDateStr(g.date) ? (g.date || '') : '',
    comment: typeof g.comment === 'string' ? g.comment.slice(0, 200) : ''
  };
}

function sanitizeHW(h) {
  if (!h || typeof h !== 'object') return null;
  if (typeof h.subject !== 'string' || !h.subject) return null;
  if (typeof h.task !== 'string' || !h.task) return null;
  return {
    id: typeof h.id === 'number' || typeof h.id === 'string' ? h.id : crypto.randomUUID(),
    subject: h.subject.slice(0, 100),
    task: h.task.slice(0, 500),
    date: isValidDateStr(h.date) ? (h.date || '') : '',
    done: !!h.done
  };
}

// ============================================================
// Хранилище с валидацией
// ============================================================
const store = {
  get(key, sanitizer) {
    try {
      const raw = localStorage.getItem('diary_' + key);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      if (sanitizer) return arr.map(sanitizer).filter(Boolean);
      return arr;
    } catch (e) {
      console.warn('Ошибка чтения данных:', e);
      return [];
    }
  },
  set(key, val) {
    try {
      localStorage.setItem('diary_' + key, JSON.stringify(val));
    } catch (e) {
      alert('Не удалось сохранить данные: ' + e.message);
    }
  }
};

// ============================================================
// КОНСТАНТЫ
// ============================================================
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const DAYS_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WEEKDAY_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function getSemesterStart() {
  const saved = localStorage.getItem('diary_semesterStart');
  if (saved) {
    const d = new Date(saved);
    if (!isNaN(d.getTime())) return d;
  }
  const now = new Date();
  const year = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
  return new Date(year, 8, 1);
}

function getWeekType(date) {
  const start = getSemesterStart();
  const weeks = Math.floor((date - start) / (7 * 24 * 60 * 60 * 1000));
  return weeks % 2 === 0 ? 'numerator' : 'denominator';
}

function isDateInLessonPeriod(lesson, date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  if (lesson.dateFrom) {
    const from = new Date(lesson.dateFrom); from.setHours(0,0,0,0);
    if (d < from) return false;
  }
  if (lesson.dateTo) {
    const to = new Date(lesson.dateTo); to.setHours(0,0,0,0);
    if (d > to) return false;
  }
  return true;
}

function getLessonsForDate(date) {
  const data = store.get('schedule', sanitizeLesson);
  const wt = getWeekType(date);
  const jsDay = date.getDay();
  const dayIdx = jsDay === 0 ? -1 : jsDay - 1;
  if (dayIdx < 0 || dayIdx >= DAYS.length) return [];
  const dayName = DAYS[dayIdx];
  return data
    .filter(l => l.day === dayName
      && (l.week === 'both' || l.week === wt)
      && isDateInLessonPeriod(l, date))
    .sort((a,b) => (parseInt(a.num)||99) - (parseInt(b.num)||99));
}

function getNextLessonDate(lesson) {
  const today = new Date(); today.setHours(0,0,0,0);
  const targetDayIdx = DAYS.indexOf(lesson.day);
  if (targetDayIdx === -1) return null;
  const jsTargetDay = targetDayIdx + 1;
  for (let offset = 0; offset < 90; offset++) {
    const d = new Date(today);
    d.setDate(today.getDate() + offset);
    if (d.getDay() === jsTargetDay) {
      const wt = getWeekType(d);
      if ((lesson.week === 'both' || lesson.week === wt)
          && isDateInLessonPeriod(lesson, d)) {
        return d;
      }
    }
  }
  return null;
}

function fmtDate(d) { return d ? `${d.getDate()} ${MONTHS[d.getMonth()]}` : ''; }
function fmtDateFull(d) {
  return d ? `${DAYS_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : '';
}
function fmtDateShort(d) {
  if (!d) return '';
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
}

function getNow() {
  const now = new Date();
  return {
    now,
    timeStrSec: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`
  };
}

function timeToMin(t) {
  if (!t) return -1;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function isLessonNow(lesson, date) {
  if (!date) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  if (date.getTime() !== today.getTime()) return false;
  if (lesson.status === 'cancelled') return false;
  const now = new Date();
  const curMin = now.getHours() * 60 + now.getMinutes();
  return curMin >= timeToMin(lesson.start) && curMin < timeToMin(lesson.end);
}

function findCurrentLesson() {
  return getLessonsForDate(new Date()).find(l => isLessonNow(l, new Date()));
}

function findNextLesson() {
  const curMin = (() => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); })();
  return getLessonsForDate(new Date())
    .find(l => l.status !== 'cancelled' && timeToMin(l.start) > curMin);
}

// ============================================================
// UI
// ============================================================
let currentWeekView = 'current';

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  (btn || event.target).closest('.tab').classList.add('active');
  document.getElementById(name).classList.add('active');
  if (name === 'calendar') renderCalendar();
}

function setWeekView(view) {
  currentWeekView = view;
  document.querySelectorAll('.week-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  renderSchedule();
}

function addLesson() {
  const day = document.getElementById('sDay').value;
  const week = document.getElementById('sWeek').value;
  const type = document.getElementById('sType').value;
  const num = document.getElementById('sNum').value.trim();
  const subject = document.getElementById('sSubject').value.trim();
  const room = document.getElementById('sRoom').value.trim();
  const teacher = document.getElementById('sTeacher').value.trim();
  const start = document.getElementById('sStart').value;
  const end = document.getElementById('sEnd').value;
  const dateFrom = document.getElementById('sDateFrom').value;
  const dateTo = document.getElementById('sDateTo').value;
  if (!subject) return alert('Введите предмет');
  if (start && end && end <= start) return alert('Конец должен быть позже начала');
  if (dateFrom && dateTo && dateTo < dateFrom) return alert('Дата «по» должна быть позже «с»');
  const data = store.get('schedule', sanitizeLesson);
  data.push({
    id: crypto.randomUUID(), day, week, type, num, subject, room, teacher,
    start, end, dateFrom: dateFrom || null, dateTo: dateTo || null, status: null
  });
  store.set('schedule', data);
  ['sNum','sSubject','sRoom','sTeacher','sStart','sEnd','sDateFrom','sDateTo'].forEach(id => {
    document.getElementById(id).value = '';
  });
  renderSchedule(); renderCalendar();
}

function delLesson(id) {
  if (!confirm('Удалить этот урок?')) return;
  store.set('schedule', store.get('schedule', sanitizeLesson).filter(x => x.id !== id));
  renderSchedule(); renderCalendar();
}

function toggleStatus(id, status) {
  const data = store.get('schedule', sanitizeLesson);
  const item = data.find(x => x.id === id);
  if (!item) return;
  item.status = (item.status === status) ? null : status;
  store.set('schedule', data);
  renderSchedule(); renderCalendar();
}

function minutesBetween(s, e) {
  if (!s || !e) return 0;
  return timeToMin(e) - timeToMin(s);
}

function fmtDuration(min) {
  if (min <= 0) return '';
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h} ч ${m} мин`;
  if (h) return `${h} ч`;
  return `${m} мин`;
}

function lessonMatchesView(l, view) {
  if (view === 'both') return true;
  if (view === 'current') {
    const wt = getWeekType(new Date());
    return l.week === 'both' || l.week === wt;
  }
  return l.week === 'both' || l.week === view;
}

function weekBadge(l) {
  if (l.week === 'both') return '<span class="week-badge both">Все</span>';
  if (l.week === 'numerator') return '<span class="week-badge numerator">Числ.</span>';
  if (l.week === 'denominator') return '<span class="week-badge denominator">Знам.</span>';
  return '';
}

function typeBadge(l) {
  if (l.type === 'lecture') return '<span class="type-badge lecture">Лекция</span>';
  if (l.type === 'seminar') return '<span class="type-badge seminar">Семинар</span>';
  return '';
}

function periodBadge(l) {
  if (!l.dateFrom && !l.dateTo) return '';
  const from = l.dateFrom ? fmtDateShort(new Date(l.dateFrom)) : 'начала';
  const to = l.dateTo ? fmtDateShort(new Date(l.dateTo)) : 'конца';
  return `<span class="period-badge">🗓 ${esc(from)} — ${esc(to)}</span>`;
}

function renderSchedule() {
  const data = store.get('schedule', sanitizeLesson);
  const view = document.getElementById('scheduleView');
  const isBothMode = currentWeekView === 'both';
  const visibleData = data.filter(l => lessonMatchesView(l, currentWeekView));
  const today = new Date(); today.setHours(0,0,0,0);
  const jsDay = today.getDay();
  const todayIdx = jsDay === 0 ? -1 : jsDay - 1;

  if (!visibleData.length) {
    view.innerHTML = `<div class="empty">Расписание пустое 👆</div>`;
    renderNowBlock();
    return;
  }

  view.innerHTML = DAYS.map((day, dayIdx) => {
    const lessons = visibleData.filter(l => l.day === day)
      .sort((a,b) => (parseInt(a.num)||99) - (parseInt(b.num)||99));
    if (!lessons.length) return '';
    const isToday = dayIdx === todayIdx;
    const totalMin = lessons.filter(l => l.status !== 'cancelled')
      .reduce((s, l) => s + minutesBetween(l.start, l.end), 0);
    const totalStr = fmtDuration(totalMin);
    const cancelledCount = lessons.filter(l => l.status === 'cancelled').length;

    return `<div class="day-block">
      <div class="day-title ${isToday ? 'today' : ''}">
        <span>${esc(day)}${isToday ? '<span class="today-tag">СЕГОДНЯ</span>' : ''}${cancelledCount ? ` (${cancelledCount} отменено)` : ''}</span>
        ${totalStr ? `<span class="duration">⏱ ${esc(totalStr)}</span>` : ''}
      </div>
      <div class="day-content">
        ${lessons.map(l => {
          const dur = minutesBetween(l.start, l.end);
          const nextDate = getNextLessonDate(l);
          const isNow = isLessonNow(l, nextDate);
          const rowClass = [l.status || '', l.type ? 'type-' + l.type : '', isNow ? 'now' : ''].filter(Boolean).join(' ');

          let statusBadge = '';
          if (isNow) statusBadge = '<span class="status-badge now">▶ ИДЁТ СЕЙЧАС</span>';
          else if (l.status === 'cancelled') statusBadge = '<span class="status-badge cancelled">ОТМЕНЁН</span>';
          else if (l.status === 'attended') statusBadge = '<span class="status-badge attended">БЫЛ</span>';
          else if (l.status === 'missed') statusBadge = '<span class="status-badge missed">ПРОПУСК</span>';

          const metaParts = [];
          if (l.room) metaParts.push(`<span>🚪 ${esc(l.room)}</span>`);
          if (l.teacher) metaParts.push(`<span>👤 ${esc(l.teacher)}</span>`);

          return `<div class="lesson-row ${rowClass}">
            <div class="lesson-info">
              <strong>${esc(l.num ? l.num + '.' : '•')}</strong>
              <span class="subject-name">${esc(l.subject)}</span>
              ${typeBadge(l)}
              ${isBothMode ? weekBadge(l) : ''}
              ${nextDate ? `<span class="date-badge">📅 ${esc(fmtDate(nextDate))}</span>` : '<span class="date-badge" style="background:#ffe0e0;color:#c0392b">⛔ вне периода</span>'}
              ${periodBadge(l)}
              ${(l.start || l.end) ? `<span class="time-badge">${esc(l.start || '?')} – ${esc(l.end || '?')}</span>` : ''}
              ${dur > 0 && l.status !== 'cancelled' ? `<span class="duration-badge">${esc(fmtDuration(dur))}</span>` : ''}
              ${statusBadge}
              ${metaParts.length ? `<div class="lesson-meta">${metaParts.join('')}</div>` : ''}
            </div>
            <div class="lesson-actions">
              <button class="icon-btn attend ${l.status === 'attended' ? 'active' : ''}"
                      onclick="toggleStatus('${esc(String(l.id))}', 'attended')" title="Присутствовал">✓</button>
              <button class="icon-btn miss ${l.status === 'missed' ? 'active' : ''}"
                      onclick="toggleStatus('${esc(String(l.id))}', 'missed')" title="Пропустил">✗</button>
              <button class="icon-btn cancel ${l.status === 'cancelled' ? 'active' : ''}"
                      onclick="toggleStatus('${esc(String(l.id))}', 'cancelled')" title="Отменён">🚫</button>
              <button class="icon-btn del-btn"
                      onclick="delLesson('${esc(String(l.id))}')" title="Удалить">×</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('') || '<div class="empty">Расписание пустое</div>';

  renderNowBlock();
}

function renderNowBlock() {
  const block = document.getElementById('nowBlock');
  const current = findCurrentLesson();
  const next = findNextLesson();

  if (current) {
    const meta = [];
    if (current.room) meta.push(`🚪 ${esc(current.room)}`);
    if (current.teacher) meta.push(`👤 ${esc(current.teacher)}`);
    const leftMin = timeToMin(current.end) - (() => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); })();
    block.innerHTML = `<div class="now-block now-now">
      <div class="icon">🔴</div>
      <div class="info">
        <div class="label">Идёт сейчас</div>
        <div class="subject">${esc(current.subject)} ${current.type === 'lecture' ? '🟢' : '🟠'}</div>
        <div class="details">${esc(current.start)}–${esc(current.end)} • ${meta.join(' • ') || '—'} • осталось ${esc(fmtDuration(leftMin))}</div>
      </div>
    </div>`;
    return;
  }
  if (next) {
    const meta = [];
    if (next.room) meta.push(`🚪 ${esc(next.room)}`);
    if (next.teacher) meta.push(`👤 ${esc(next.teacher)}`);
    const leftMin = timeToMin(next.start) - (() => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); })();
    block.innerHTML = `<div class="now-block">
      <div class="icon">⏭</div>
      <div class="info">
        <div class="label">Далее сегодня</div>
        <div class="subject">${esc(next.subject)} ${next.type === 'lecture' ? '🟢' : '🟠'}</div>
        <div class="details">${esc(next.start)}–${esc(next.end)} • ${meta.join(' • ') || '—'} • через ${esc(fmtDuration(leftMin))}</div>
      </div>
    </div>`;
    return;
  }
  block.innerHTML = '';
}

// ============================================================
// КАЛЕНДАРЬ
// ============================================================
let calYear, calMonth, calSelectedDate;

function calInit() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  calSelectedDate = new Date(now); calSelectedDate.setHours(0,0,0,0);
}

function calNav(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function calGoToday() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  calSelectedDate = new Date(now); calSelectedDate.setHours(0,0,0,0);
  renderCalendar();
}

function calSelectDate(y, m, d) {
  calSelectedDate = new Date(y, m, d);
  renderCalendar();
}

function renderCalendar() {
  if (calYear === undefined) calInit();
  document.getElementById('calTitle').textContent = `${MONTHS_NOM[calMonth]} ${calYear}`;
  const grid = document.getElementById('calGrid');
  const today = new Date(); today.setHours(0,0,0,0);
  let html = WEEKDAY_SHORT.map(d => `<div class="cal-weekday">${d}</div>`).join('');
  const first = new Date(calYear, calMonth, 1);
  const startOffset = first.getDay() === 0 ? 6 : first.getDay() - 1;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    let cellDate, isOther = false;
    if (i < startOffset) {
      cellDate = new Date(calYear, calMonth - 1, daysInPrev - startOffset + i + 1);
      isOther = true;
    } else if (i >= startOffset + daysInMonth) {
      cellDate = new Date(calYear, calMonth + 1, i - startOffset - daysInMonth + 1);
      isOther = true;
    } else {
      cellDate = new Date(calYear, calMonth, i - startOffset + 1);
    }
    cellDate.setHours(0,0,0,0);
    const lessons = getLessonsForDate(cellDate);
    const isToday = cellDate.getTime() === today.getTime();
    const isSel = calSelectedDate && cellDate.getTime() === calSelectedDate.getTime();
    const classes = ['cal-day'];
    if (isOther) classes.push('other-month');
    if (isToday) classes.push('today');
    if (isSel) classes.push('selected');

    let lessonsHtml = '';
    const maxShow = 2;
    lessons.slice(0, maxShow).forEach(l => {
      const tc = l.status === 'cancelled' ? 'cancelled' : l.type;
      lessonsHtml += `<div class="cal-lesson-dot ${tc}">${esc(l.start || '')} ${esc(l.subject)}</div>`;
    });
    if (lessons.length > maxShow) lessonsHtml += `<div class="cal-more">+${lessons.length - maxShow} ещё</div>`;

    html += `<div class="${classes.join(' ')}" onclick="calSelectDate(${cellDate.getFullYear()}, ${cellDate.getMonth()}, ${cellDate.getDate()})">
      <div class="cal-date">${cellDate.getDate()}</div>
      <div class="cal-lessons">${lessonsHtml}</div>
    </div>`;
  }
  grid.innerHTML = html;
  renderCalDayDetails();
}

function renderCalDayDetails() {
  const box = document.getElementById('calDayDetails');
  if (!calSelectedDate) { box.innerHTML = ''; return; }
  const lessons = getLessonsForDate(calSelectedDate);
  const wt = getWeekType(calSelectedDate);
  const wtLabel = wt === 'numerator' ? '🔵 Числитель' : '🟣 Знаменатель';

  if (!lessons.length) {
    box.innerHTML = `<div class="cal-day-details">
      <h3>${esc(fmtDateFull(calSelectedDate))} • ${esc(wtLabel)}</h3>
      <div class="empty" style="padding:15px">Занятий нет 🎉</div>
    </div>`;
    return;
  }

  box.innerHTML = `<div class="cal-day-details">
    <h3>${esc(fmtDateFull(calSelectedDate))} • ${esc(wtLabel)} • ${lessons.length} ${lessons.length === 1 ? 'занятие' : 'занятий'}</h3>
    ${lessons.map(l => {
      const tc = l.status === 'cancelled' ? 'cancelled' : l.type;
      const meta = [];
      if (l.room) meta.push(`🚪 ${esc(l.room)}`);
      if (l.teacher) meta.push(`👤 ${esc(l.teacher)}`);
      if (l.start) meta.push(`🕐 ${esc(l.start)}–${esc(l.end || '?')}`);
      const st = l.status === 'cancelled' ? ' • ОТМЕНЁН'
        : l.status === 'attended' ? ' • БЫЛ'
        : l.status === 'missed' ? ' • ПРОПУСК' : '';
      return `<div class="cal-day-lesson ${tc}">
        <div>
          <div class="subject">${esc(l.num ? l.num + '. ' : '')}${esc(l.subject)}</div>
          <div class="meta">${meta.join(' • ')}${st}</div>
        </div>
        <span class="type-badge ${l.type}">${l.type === 'lecture' ? 'Лекция' : 'Семинар'}</span>
      </div>`;
    }).join('')}
  </div>`;
}

// ============================================================
// ОЦЕНКИ
// ============================================================
function addGrade() {
  const subject = document.getElementById('gSubject').value.trim();
  const value = parseInt(document.getElementById('gValue').value);
  const date = document.getElementById('gDate').value;
  const comment = document.getElementById('gComment').value.trim();
  if (!subject || !value) return alert('Введите предмет и оценку');
  if (value < 2 || value > 5) return alert('Оценка от 2 до 5');
  const data = store.get('grades', sanitizeGrade);
  data.push({ id: crypto.randomUUID(), subject, value, date, comment });
  store.set('grades', data);
  ['gSubject','gValue','gComment'].forEach(id => document.getElementById(id).value = '');
  renderGrades();
}

function delGrade(id) {
  if (!confirm('Удалить оценку?')) return;
  store.set('grades', store.get('grades', sanitizeGrade).filter(x => x.id !== id));
  renderGrades();
}

function renderGrades() {
  const data = store.get('grades', sanitizeGrade).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const body = document.getElementById('gradesBody');
  if (!data.length) {
    body.innerHTML = '<tr><td colspan="5" class="empty">Оценок пока нет</td></tr>';
  } else {
    body.innerHTML = data.map(g => `<tr>
      <td>${esc(g.subject)}</td>
      <td><span class="badge g${g.value}">${g.value}</span></td>
      <td>${esc(g.date || '—')}</td>
      <td>${esc(g.comment || '—')}</td>
      <td><button class="btn del" onclick="delGrade('${esc(String(g.id))}')">✕</button></td>
    </tr>`).join('');
  }
  if (data.length) {
    const avg = (data.reduce((s,g) => s + g.value, 0) / data.length).toFixed(2);
    const c = {5:0,4:0,3:0,2:0};
    data.forEach(g => c[g.value]++);
    document.getElementById('gradesStats').innerHTML =
      `📊 Средний балл: <b>${avg}</b> &nbsp;|&nbsp; 5️⃣ ${c[5]} &nbsp; 4️⃣ ${c[4]} &nbsp; 3️⃣ ${c[3]} &nbsp; 2️⃣ ${c[2]}`;
  } else {
    document.getElementById('gradesStats').innerHTML = '';
  }
}

// ============================================================
// Д/З
// ============================================================
function addHW() {
  const subject = document.getElementById('hSubject').value.trim();
  const task = document.getElementById('hTask').value.trim();
  const date = document.getElementById('hDate').value;
  if (!subject || !task) return alert('Заполните предмет и задание');
  const data = store.get('homework', sanitizeHW);
  data.push({ id: crypto.randomUUID(), subject, task, date, done: false });
  store.set('homework', data);
  ['hSubject','hTask'].forEach(id => document.getElementById(id).value = '');
  renderHW();
}

function delHW(id) {
  if (!confirm('Удалить задание?')) return;
  store.set('homework', store.get('homework', sanitizeHW).filter(x => x.id !== id));
  renderHW();
}

function toggleHW(id) {
  const data = store.get('homework', sanitizeHW);
  const item = data.find(x => x.id === id);
  if (item) item.done = !item.done;
  store.set('homework', data);
  renderHW();
}

function renderHW() {
  const data = store.get('homework', sanitizeHW);
  const today = new Date(); today.setHours(0,0,0,0);
  data.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (a.date || 'z').localeCompare(b.date || 'z');
  });
  const undone = data.filter(h => !h.done).length;
  const counter = document.getElementById('hwCounter');
  if (undone > 0) {
    counter.textContent = undone;
    counter.style.display = 'inline-block';
  } else {
    counter.style.display = 'none';
  }
  const list = document.getElementById('hwList');
  if (!data.length) {
    list.innerHTML = '<div class="empty">Домашних заданий нет 🎉</div>';
    return;
  }
  list.innerHTML = data.map(h => {
    const overdue = h.date && !h.done && new Date(h.date) < today;
    return `<div class="hw-item ${h.done ? 'done' : ''} ${overdue ? 'overdue' : ''}">
      <div class="hw-actions">
        <div class="checkbox ${h.done ? 'checked' : ''}" onclick="toggleHW('${esc(String(h.id))}')">${h.done ? '✓' : ''}</div>
        <button class="btn del" onclick="delHW('${esc(String(h.id))}')">✕</button>
      </div>
      <div class="info">
        <div class="subject">${esc(h.subject)}</div>
        <div class="task">${esc(h.task)}</div>
        ${h.date ? `<div class="date ${overdue ? 'overdue-text' : ''}">📅 до ${esc(h.date)}${overdue ? ' — ПРОСРОЧЕНО' : ''}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ============================================================
// ЧАСЫ
// ============================================================
function updateClock() {
  const { now, timeStrSec } = getNow();
  document.getElementById('todayDate').innerHTML = `📅 <b>${esc(fmtDateFull(now))}</b>`;
  const wt = getWeekType(now);
  document.getElementById('todayWeek').innerHTML = `🗓 <b>${wt === 'numerator' ? '🔵 Числитель' : '🟣 Знаменатель'}</b>`;
  document.getElementById('todayTime').innerHTML = `🕐 <b>${esc(timeStrSec)}</b>`;
}

let lastMinute = -1;
setInterval(() => {
  updateClock();
  const m = new Date().getMinutes();
  if (m !== lastMinute) {
    lastMinute = m;
    renderSchedule();
    renderHW();
    if (document.getElementById('calendar').classList.contains('active')) renderCalendar();
  }
}, 1000);

// ============================================================
// PWA: установка
// ============================================================
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    hideInstallBanner();
  });
}

function hideInstallBanner() {
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('diary_installDismissed', '1');
}

if (localStorage.getItem('diary_installDismissed')) {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('installBanner').classList.remove('show');
  });
}

// ============================================================
// PWA: service worker + офлайн-индикатор
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(() => console.log('✅ Service Worker зарегистрирован'))
      .catch(err => console.warn('⚠️ SW не зарегистрирован:', err));
  });
}

function updateOnlineStatus() {
  const badge = document.getElementById('offlineBadge');
  if (navigator.onLine) badge.classList.remove('show');
  else badge.classList.add('show');
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ============================================================
// СТАРТ
// ============================================================
document.querySelector('.week-btn[data-view="current"]').classList.add('active');
calInit();
updateClock();
renderSchedule();
renderGrades();
renderHW();
renderCalendar();
</script>
